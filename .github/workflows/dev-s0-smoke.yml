name: dev-s0-smoke

# TEMPORARY, branch-only: re-runs the consumer link smoke against the
# windows-x64 artifact of a finished build run (m150/smoke/dev-run-id).
# Removed before the PR merges.

on:
  push:
    branches: [feat/m150-windows-s0]
    paths:
      - ".github/workflows/dev-s0-smoke.yml"
      - "m150/smoke/**"
      - "m150/ci/link-smoke.py"

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ctrl
          persist-credentials: false

      - name: Which build run
        id: rid
        run: echo "id=$(tr -d '\r\n ' < ctrl/m150/smoke/dev-run-id)" >> "$GITHUB_OUTPUT"

      - name: Download the build artifact of that run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: out
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ github.token }}

      - name: Fetch the compiler package named by build-flags.json
        run: |
          set -euo pipefail
          url=$(python -c "import json; print(json.load(open('out/build-flags.json'))['toolchain']['clang_package_url'])")
          sha=$(python -c "import json; print(json.load(open('out/build-flags.json'))['toolchain']['clang_package_sha256'])")
          curl --proto '=https' --tlsv1.2 -fsSL -o clang.tar.xz "$url"
          echo "$sha *clang.tar.xz" | sha256sum -c -
          mkdir -p C:/clang
          tar -xJf clang.tar.xz -C C:/clang

      - name: Compile, link and run the out-of-tree consumer
        run: python ctrl/m150/ci/link-smoke.py out C:/clang C:/smoke ctrl/m150/smoke/consumer.cc
