name: dev-s0-smoke

# TEMPORARY, branch-only (feat/m150-windows-s0): fast loop for the consumer
# link smoke. Takes the s0-pkg artifact (libcxx.lib, webrtc-headers.zip,
# build-flags.json) of the dev-s0-package run named in m150/smoke/dev-run-id,
# adds the published dplc-1 webrtc.lib as stand-in, and runs link-smoke.py.
# No source sync, so an iteration takes a few minutes. Deleted before the PR
# merges.

on:
  push:
    branches: [feat/m150-windows-s0]
    paths:
      - ".github/workflows/dev-s0-smoke.yml"
      - "m150/smoke/**"
      - "m150/ci/link-smoke.py"

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ctrl
          persist-credentials: false

      - name: Which package run
        id: rid
        run: echo "id=$(tr -d '\r\n ' < ctrl/m150/smoke/dev-run-id)" >> "$GITHUB_OUTPUT"

      - name: Download the package artifact of that run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: s0-pkg
          path: out
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ github.token }}

      - name: Stand-in webrtc.lib (published dplc-1, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o out/webrtc.lib "https://github.com/sigarone/webrtc-aes256-build/releases/download/webrtc-windows-m150-a256-dplc-1/webrtc.lib"
          echo "9d00b0cdffd05ab61137c4ca65ea495d73e2cfc8a746e9dd96b31bb9dbd0aa58 *out/webrtc.lib" | sha256sum -c -
          ls -l out

      - name: Fetch the compiler package named by build-flags.json
        run: |
          set -euo pipefail
          py=python
          url=$("$py" -c "import json; print(json.load(open('out/build-flags.json'))['toolchain']['clang_package_url'])")
          sha=$("$py" -c "import json; print(json.load(open('out/build-flags.json'))['toolchain']['clang_package_sha256'])")
          curl -fsSL -o clang.tar.xz "$url"
          echo "$sha *clang.tar.xz" | sha256sum -c -
          mkdir -p C:/clang
          tar -xJf clang.tar.xz -C C:/clang

      - name: Compile, link and run the out-of-tree consumer
        run: cmd //c "ctrl\\m150\\ci\\run-in-vcvars.cmd python ctrl/m150/ci/link-smoke.py out C:/clang C:/smoke ctrl/m150/smoke/consumer.cc"
