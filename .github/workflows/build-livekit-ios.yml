name: build-webrtc-aes256-livekit-ios

# Builds an LK-symbol-prefixed "LiveKitWebRTC.xcframework" (drop-in for
# livekit/webrtc-xcframework's `LiveKitWebRTC` SwiftPM product, which
# `client-sdk-swift` depends on for GROUP calls — see
# apps/qaudion-ios/QAudionEngine/Package.swift) with the SAME
# aes256-framecryptor.patch already used by build-ios.yml for the 1:1-call
# WebRTC.xcframework, PLUS the apple_prefix.patch that gives LiveKit's fork
# its `LK`-prefixed Objective-C symbols (RTCPeerConnection ->
# LKRTCPeerConnection, etc.) so it can coexist in the same binary as this
# repo's plain WebRTC.xcframework without symbol collisions — exactly the
# "Symbol Namespace Isolation" contract QAudionEngine/Package.swift already
# documents for the dual-WebRTC (1:1 vs group-call) setup.
#
# Provenance: apple_prefix.patch and apple/xcframework-livekit-ios.sh are
# vendored (MIT license) from https://github.com/webrtc-sdk/webrtc-build —
# the SAME repo livekit/webrtc-xcframework's own README says its releases
# are built from ("Built using: webrtc-sdk/webrtc + webrtc-sdk/webrtc-build").
# xcframework-livekit-ios.sh is an iOS-only trim of that repo's
# build/apple/xcframework.sh (drops the macOS/catalyst/tvOS/xrOS slices
# Q-Audion's SwiftPM binaryTarget never consumes) — see that file's header
# for the exact diff from upstream.
#
# NOT a from-scratch fork: same webrtc-sdk/webrtc@m144_release checkout as
# build-ios.yml, three patches applied in sequence (no overlapping hunks —
# aes256-framecryptor.patch and native-pli.patch only touch
# api/crypto/frame_crypto_transformer.h/.cc; apple_prefix.patch touches
# sdk/objc/base/RTCMacros.h, sdk/BUILD.gn, tools_webrtc/ios/*,
# sdk/objc/Info.plist), then a direct gn/ninja/xcodebuild build (not
# tools_webrtc/ios/build_ios_libs.py, which upstream's apple_prefix.patch
# also retargets to "LiveKitWebRTC.xcframework" naming but which this job
# does not invoke). native-pli.patch adds the W-NATIVEPLI unconditional
# rate-limited kDecryptionFailed observer notification on decrypt-tag-
# mismatch — the same patch already wired into the Android AAR builds in
# build.yml/build-livekit-android.yml (see cc92927e7).
#
# Run via Actions -> build-webrtc-aes256-livekit-ios -> Run workflow.
# Expected build time: in the same range as build-ios.yml (~1h, well under
# the 3-4h conservative estimate) — but this is a NEW packaging path never
# run before in this repo; budget for at least one failed/iterated run
# (GN arg mismatch, missing gn target, etc.) before it goes green
# unattended, same as build-ios.yml's own history before it stabilized.

on:
  workflow_dispatch:
    inputs:
      webrtc_ref:
        description: "tag on sigarone/webrtc (see checkout step below for why not a raw SHA)"
        # RE-PINNED 2026-08-26 — the previous default below
        # ("770e5461892d-livekit-aes256", commit 770e5461892d7d1aaff7ff886-
        # ab1fc7c5cd77bd1, dated 2026-03-30) was NEVER actually the ref that
        # built the last known-good release. That release
        # (webrtc-ios-aes256-livekit-m144-7559.10, run 30340955866,
        # 2026-07-28) was produced by a workflow_dispatch call that manually
        # OVERRODE this input to "f47af7bc9658-livekit-aes256-7559.10"
        # (confirmed from that run's own "gclient config + sync" step log) —
        # but this YAML default was never updated to match, so it silently
        # stayed on the older March-30 pin. The 2026-08-26 native-pli run
        # (32959229056) used this stale default as-is (no override given)
        # and its LiveKitWebRTC.xcframework.zip came out missing
        # Headers/RTCAudioProcessingState.h relative to the .7559.10 build —
        # confirmed by downloading both release zips and diffing the actual
        # Headers/ listing (only that one file differs, everything else
        # matches). Root-caused to real upstream content, not a build-script
        # bug: `sdk/objc/api/peerconnection/RTCAudioProcessingState.h` does
        # not exist anywhere in sigarone/webrtc's tree at 770e5461892d7d1a...
        # (verified via the GitHub Trees API, non-truncated, zero matches for
        # "AudioProcessingState") but DOES exist at f47af7bc965851090bef9fce-
        # 9a4284f468d20a44 ("Fix AudioEngineDevice crash from null
        # FineAudioBuffer on playout/record start (#256)", 2026-06-15) — i.e.
        # upstream added this header (part of the "Audio processing state v2"
        # work, see the #254 note below) sometime between the two pins, and
        # the March-30 pin simply predates it. Re-pointing the default at the
        # tag that was actually proven to work restores the header and keeps
        # every future un-overridden dispatch (like the one that caused this)
        # on the same known-good source.
        #
        # Original 2026-07-15 rationale for pinning away from the rolling
        # branch (still valid, kept for context): NOT "m144_release" (a
        # rolling branch, not a fixed ref) — the first build from that
        # default picked up 2.5 months of subsequent commits including
        # "Audio processing state v2: factory-owned read-back, redesigned
        # state API (#254)" (2026-06-11), which REMOVED the
        # RTCAudioDeviceModule property client-sdk-swift 2.13.0's
        # AudioManager.swift calls directly (isVoiceProcessingEnabled) in
        # favor of a new RTCPlatformAudioProcessingState API, breaking
        # compile (confirmed live, CI run 29452170871: "value of type
        # 'LKRTCAudioDeviceModule' has no member 'isVoiceProcessingEnabled'").
        # f47af7bc9658... (2026-06-15) is AFTER #254 and still has the plain
        # RTCAudioDeviceModule property (unaffected — proven live by the
        # .7559.10 build client-sdk-swift 2.16.0-aes256-raw4 already
        # consumes successfully) as well as the new RTCAudioProcessingState
        # API alongside it, so it satisfies both requirements at once. This
        # is a TAG NAME (on the sigarone/webrtc fork below), NOT a raw commit
        # SHA — confirmed live (run 29452647799) that GitHub rejects `git
        # fetch origin <sha> --depth=1` for an arbitrary commit not at a ref
        # tip ("couldn't find remote ref"), so a lightweight tag was created
        # via the Git Data API on a fork instead, which IS shallow-fetchable
        # like any real ref.
        default: "f47af7bc9658-livekit-aes256-7559.10"
      release_tag:
        description: "GitHub release tag to host the LiveKitWebRTC.xcframework zip"
        # webrtc-ios-aes256-livekit-m144-native-pli already exists and holds
        # the BROKEN (missing-header) build's release notes/asset from
        # 2026-08-26 — do not reuse it, tag fresh instead.
        # NEW tag required: an existing release is a rollback asset and the
        # publish step below refuses to overwrite it.
        default: "webrtc-ios-aes256-livekit-m144-native-pli-nokeylog"

permissions:
  contents: write

env:
  DEPOT_TOOLS_UPDATE: "0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout this repo (patches + build script)
        uses: actions/checkout@v4
        with:
          path: ctrl

      - name: Select full Xcode (16.x — M144 needs the iOS 18 SDK modulemaps)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then XC="$(ls -d /Applications/Xcode_1*.app 2>/dev/null | sort -V | tail -1)"; fi
          if [ -z "$XC" ]; then XC="/Applications/Xcode.app"; fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcode-select -p
          xcodebuild -version
          echo "=== iOS SDKs ==="; xcodebuild -showsdks | grep -i ios || true

      - name: Reclaim disk (best-effort, never fails)
        shell: bash
        run: |
          set +e
          xcrun simctl delete all >/dev/null 2>&1
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches"/* >/dev/null 2>&1
          sudo rm -rf /usr/local/lib/android "${ANDROID_HOME:-}" >/dev/null 2>&1
          df -h /
          exit 0

      - name: Install depot_tools
        run: |
          set -euo pipefail
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient config + sync (iOS, shallow)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p webrtc && cd webrtc
          cat > .gclient <<EOF
          solutions = [{
            "name": "src",
            "url": "https://github.com/sigarone/webrtc.git@${{ github.event.inputs.webrtc_ref }}",
            "deps_file": "DEPS",
            "managed": False,
            "custom_deps": {},
          }]
          target_os = ["ios", "mac"]
          EOF
          echo "::group::gclient sync"
          gclient sync --no-history --shallow --nohooks
          echo "::endgroup::"
          echo "::group::runhooks"
          gclient runhooks
          echo "::endgroup::"
          du -sh src 2>/dev/null || true
          df -h /

      - name: Apply AES-256 FrameCryptor patch
        working-directory: ${{ runner.temp }}/webrtc/src
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="
          grep -n "ratchet_salt, 128)" api/crypto/frame_crypto_transformer.h || true
          git apply -v "$GITHUB_WORKSPACE/ctrl/aes256-framecryptor.patch"
          echo "=== AFTER ==="
          grep -n "password.size() == 32 ? 256 : 128" api/crypto/frame_crypto_transformer.h

      - name: Apply Native PLI keyframe-recovery patch (W-NATIVEPLI)
        working-directory: ${{ runner.temp }}/webrtc/src
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="
          grep -n "last_decrypt_fail_notify_ms_" api/crypto/frame_crypto_transformer.h || true
          git apply -v "$GITHUB_WORKSPACE/ctrl/native-pli.patch"
          echo "=== AFTER ==="
          grep -n "last_decrypt_fail_notify_ms_{0}" api/crypto/frame_crypto_transformer.h

      - name: Apply no-key-log patch (SECURITY - never log key material)
        working-directory: ${{ runner.temp }}/webrtc/src
        run: |
          set -euo pipefail
          echo "=== BEFORE (upstream prints secret/salt/derived key at LS_INFO) ==="
          grep -nE 'derived_key |slat << ' api/crypto/frame_crypto_transformer.cc || true
          git apply -v "$GITHUB_WORKSPACE/ctrl/no-key-log.patch"
          echo "=== AFTER (must be empty) ==="
          if grep -nE 'derived_key |slat << |"raw_key ' api/crypto/frame_crypto_transformer.cc; then
            echo "::error::key-material log statements still present after no-key-log.patch"
            exit 1
          fi

      - name: Apply LK symbol-prefix patch (LiveKit fork parity)
        working-directory: ${{ runner.temp }}/webrtc/src
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="
          grep -n "RTC_OBJC_TYPE_PREFIX" sdk/objc/base/RTCMacros.h || true
          git apply -v "$GITHUB_WORKSPACE/ctrl/apple-prefix-livekit.patch"
          echo "=== AFTER ==="
          grep -n "define RTC_OBJC_TYPE_PREFIX LK" sdk/objc/base/RTCMacros.h
          grep -n 'output_name = "LiveKitWebRTC"' sdk/BUILD.gn

      - name: Build LiveKitWebRTC.xcframework (H265 + AES-256 + LK-prefix)
        working-directory: ${{ runner.temp }}/webrtc/src
        run: |
          set -euo pipefail
          command -v ninja && ninja --version || true
          # This job's `env.DEPOT_TOOLS_UPDATE: "0"` disables gclient's
          # self-update wrapper, which is the ONLY thing that normally runs
          # depot_tools/bootstrap_python3 (see depot_tools/update_depot_tools
          # line ~128) and writes python3_bin_reldir.txt. build-ios.yml never
          # notices because it drives everything through
          # `vpython3 tools_webrtc/ios/build_ios_libs.py` — vpython3 has its
          # own, SEPARATE CIPD-based bootstrap and never touches this file.
          # But GN's exec_script() (used all over webrtc's BUILD.gn files)
          # shells out to plain `python3` resolved via PATH, i.e. depot_tools'
          # wrapper — which hard-fails on the missing file with no
          # auto-bootstrap fallback (confirmed by reading
          # depot_tools/python-bin/python3 directly: `[[ ! -f
          # python3_bin_reldir.txt ]] && exit 1`, no lazy-init branch).
          # A prior fix here that called `vpython3 -c ...` did NOT help
          # (still failed in run 29423341150) because vpython3's bootstrap is
          # unrelated. Real fix: run depot_tools' own bootstrap function
          # directly, exactly like update_depot_tools would.
          source "$HOME/depot_tools/bootstrap_python3"
          bootstrap_python3
          test -f "$HOME/depot_tools/python3_bin_reldir.txt"
          echo "python3_bin_reldir.txt: $(cat "$HOME/depot_tools/python3_bin_reldir.txt")"
          chmod +x "$GITHUB_WORKSPACE/ctrl/apple/xcframework-livekit-ios.sh"
          mkdir -p out_livekit_ios_libs
          # EXECUTE, do not source (`.`): the script does `cd "$OUT_DIR"`
          # right before its final `zip` call (post-processing section) and
          # never cds back. Sourcing leaks that cd into THIS shell, so the
          # very next line here (`ls -la out_livekit_ios_libs`) looked for
          # out_livekit_ios_libs/out_livekit_ios_libs from inside
          # out_livekit_ios_libs itself and failed — the actual xcframework
          # build+zip had ALREADY succeeded by then (run 29426989535's own
          # log shows the full zip completing right before the failure).
          # The script already has its own `#!/bin/bash` + `set -e`, so
          # running it as a subprocess is the correct fix, not a workaround.
          "$GITHUB_WORKSPACE/ctrl/apple/xcframework-livekit-ios.sh" release "$PWD" out_livekit_ios_libs LiveKit
          echo "=== output ==="
          ls -la out_livekit_ios_libs
          test -d out_livekit_ios_libs/LiveKitWebRTC.xcframework
          echo "=== LK-prefix symbol probe (device arm64) ==="
          nm -gU out_livekit_ios_libs/LiveKitWebRTC.xcframework/ios-arm64/LiveKitWebRTC.framework/LiveKitWebRTC 2>/dev/null | grep -iE "LKRTCPeerConnection" | head || echo "(no exported LKRTCPeerConnection symbol match — objc class may be exported differently)"
          echo "=== AES-256 string probe ==="
          strings out_livekit_ios_libs/LiveKitWebRTC.xcframework/ios-arm64/LiveKitWebRTC.framework/LiveKitWebRTC 2>/dev/null | grep -iE "AES-256 GCM|aes_256_gcm" | head || true
          # SECURITY gate (binary level, EVERY slice: device + simulators): the
          # shipped framework must not contain the upstream key-dump log format
          # strings (derived_key / "slat << " / raw_key). Fails closed: no binary
          # found, a binary under 5 MB, or an unreadable file => the step fails.
          # Raw byte scan, see ci/assert-no-key-strings.sh.
          echo "=== key-dump string gate (all slices, must be clean) ==="
          SLICES=$(find out_livekit_ios_libs/LiveKitWebRTC.xcframework -type f -path '*/LiveKitWebRTC.framework/LiveKitWebRTC')
          echo "$SLICES"
          sh "$GITHUB_WORKSPACE/ctrl/ci/assert-no-key-strings.sh" -m 5000000 -p 'Failed to derive HkdfSha256 key from secret' $SLICES

      - name: Copy zip to workspace + checksum
        working-directory: ${{ runner.temp }}/webrtc/src/out_livekit_ios_libs
        run: |
          set -euo pipefail
          cp LiveKitWebRTC.xcframework.zip "$GITHUB_WORKSPACE/LiveKitWebRTC.xcframework.zip"
          cd "$GITHUB_WORKSPACE"
          ls -lh LiveKitWebRTC.xcframework.zip
          echo "=== SwiftPM checksum (use this in Package.swift) ==="
          SUM=$(shasum -a 256 LiveKitWebRTC.xcframework.zip | awk '{print $1}')
          echo "CHECKSUM(sha256)=$SUM"
          echo "checksum=$SUM" >> "$GITHUB_OUTPUT"
          echo "## LiveKitWebRTC.xcframework (AES-256 + H265 + LK-prefix)" >> "$GITHUB_STEP_SUMMARY"
          echo "checksum: \`$SUM\`" >> "$GITHUB_STEP_SUMMARY"
          echo "url: https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag }}/LiveKitWebRTC.xcframework.zip" >> "$GITHUB_STEP_SUMMARY"
        id: pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveKitWebRTC-xcframework-aes256-ios
          path: LiveKitWebRTC.xcframework.zip
          if-no-files-found: error

      - name: Publish to a fixed release tag (stable SPM url)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          REPO="${{ github.repository }}"
          # This step has no `working-directory`, so it defaults to
          # $GITHUB_WORKSPACE — which is NOT a git repo here (actions/checkout
          # above used `with: path: ctrl`, so the actual checkout lives at
          # $GITHUB_WORKSPACE/ctrl). `gh` auto-detects the target repo from
          # the cwd's git remote when --repo is omitted, so every gh command
          # here failed with "fatal: not a git repository" (confirmed live,
          # run 29429853994) despite the xcframework build+zip+artifact-upload
          # all succeeding earlier in the same run. This exact bug is ALSO
          # latent in the sibling build-ios.yml (same missing --repo, same
          # missing working-directory) — that job's one successful run's
          # publish step also failed instantly and the release asset only
          # appeared minutes later via what was almost certainly a manual
          # `gh release upload`, not the workflow itself. Passing --repo
          # explicitly removes the cwd dependency entirely.
          # NEVER overwrite a published asset (rollback binaries; see above).
          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ "$(printf '%s\n' "$ASSETS" | grep -cx 'LiveKitWebRTC.xcframework.zip' || true)" != "0" ]; then
            echo "::error::release $TAG already has LiveKitWebRTC.xcframework.zip - refusing to overwrite it. Re-run with a NEW release_tag."
            exit 1
          fi
          # --target: tag the commit that was actually built (the dispatched ref).
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "LiveKitWebRTC.xcframework AES-256 + H265 + LK-prefix (M144)" \
              --notes "webrtc-sdk M144 iOS xcframework (LK-symbol-prefixed, LiveKit-compatible) with aes256-framecryptor.patch + native-pli.patch (W-NATIVEPLI decrypt-failure signal) + no-key-log.patch (upstream key-material logging removed) + apple_prefix.patch + H265. Source: sigarone/webrtc@${{ github.event.inputs.webrtc_ref }}. checksum: ${{ steps.pkg.outputs.checksum }}"
          fi
          gh release upload "$TAG" LiveKitWebRTC.xcframework.zip --repo "$REPO"
          echo "Asset: https://github.com/$REPO/releases/download/$TAG/LiveKitWebRTC.xcframework.zip"
