name: hevc-probe

# Builds the HEVC capability probe (engine/tools/hevc-probe), runs it on the hosted
# runner (which has no GPU: "no hardware encoder" is the expected answer, the D3D11
# code path runs on the software adapter through --ci, and the probe must not crash)
# and publishes the exe plus its sha256 as a workflow artifact so that it can be run
# on real hardware.
#
# The second job (hwlab-scripts) checks the scripts of the hardware lab kit
# (engine/tools/hwlab) without installing or downloading anything: a parse check
# with Windows PowerShell 5.1, the shared HEVC Video Extensions definition (and that the
# probe checks the same package families), the inventory script and its reading of
# package manifests (on fixture manifests), and the offline plan of engine-local-build.ps1.
#
# What the hosted runner can and cannot prove about the HEVC decoder visibility and the
# D3D11VA checks: it has no GPU and no HEVC package, so it proves the shape of every new
# report section, that nothing is reported ok that was not measured, that a software
# adapter never counts, and (through the SDK header) that the decoder profile GUIDs are
# the right ones. Whether a Store HEVC decoder is returned with MFT_ENUM_FLAG_UNTRUSTED_STOREMFT,
# and what the GPU of the lab offers through D3D11VA, is measured on the lab PC.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/tools/hevc-probe/**'
      - 'engine/tools/hwlab/**'
      - '.github/workflows/hevc-probe.yml'
  push:
    branches: [main]
    paths:
      - 'engine/tools/hevc-probe/**'
      - 'engine/tools/hwlab/**'
      - '.github/workflows/hevc-probe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure and build (MSVC, static CRT)
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 12)
          cmake -S engine/tools/hevc-probe -B build -G "Visual Studio 17 2022" -A x64 "-DPROBE_GIT_SHA=$sha"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item build/Release/hevc-probe.exe | Format-List Name, Length

      - name: Check that the CRT is linked statically
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents build/Release/hevc-probe.exe
          $deps | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
          if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt|ucrtbase') {
            throw 'the probe depends on a dynamic CRT'
          }

      - name: Run on the hosted runner, HEVC (expected - no hardware encoder, no HEVC MFT - and no crash)
        shell: cmd
        run: |
          build\Release\hevc-probe.exe --ci > runner-report.json
          if errorlevel 1 exit /b 1
          if not exist build\Release\hevc-probe-report.json exit /b 1

      - name: Validate the HEVC report
        shell: pwsh
        run: |
          . engine/tools/hevc-probe/ci-helpers.ps1
          $txt = Get-Content runner-report.json -Raw
          $rep = $txt | ConvertFrom-Json
          $rep.summary | Format-List
          $rep.media_foundation | Format-List
          $rep.hevc_video_extensions | Format-List
          $rep.adapters | Format-Table description, vendor_id, dedicated_memory_mb
          if ($rep.tool.name -ne 'hevc-probe') { throw 'unexpected report' }
          if ($rep.tool.report_version -ne 3) { throw 'unexpected report version' }
          # The file next to the exe must carry the same document.
          $file = Get-Content build/Release/hevc-probe-report.json -Raw
          if ($file.Trim() -ne $txt.Trim()) { throw 'stdout and report file differ' }
          # Privacy: nothing machine- or user-specific may appear in the report.
          $secrets = @($env:COMPUTERNAME, $env:USERNAME, $env:USERPROFILE, $env:RUNNER_NAME, $env:GITHUB_WORKSPACE) |
            Where-Object { $_ -and $_.Length -ge 4 }
          foreach ($s in $secrets) {
            if ($txt.IndexOf($s, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'report contains machine or user specific text' }
          }
          if ($txt -match '\\Users\\|[A-Za-z]:\\|[0-9A-Fa-f]{2}([:-][0-9A-Fa-f]{2}){5}') { throw 'report contains a path or a MAC-like string' }
          if (@($rep.tests | Where-Object { $_.failed_stage -in @("crash", "timeout") }).Count -gt 0) { throw "a test crashed or timed out" }
          # Tri-state: every test says ok, failed or not_attempted, and a failed one says where,
          # a not attempted one says why. The old boolean "ok" must be gone.
          foreach ($t in @($rep.tests)) {
            if ($t.status -notin @('ok', 'failed', 'not_attempted')) { throw "bad test status: $($t.status)" }
            if ($t.status -eq 'failed' -and -not $t.failed_stage) { throw 'a failed test names no stage' }
            if ($t.status -eq 'not_attempted' -and (-not $t.reason -or -not $t.reason_code)) { throw 'a not attempted test gives no reason' }
            if ($t.PSObject.Properties['ok']) { throw 'the boolean ok field is back' }
          }
          # The hosted runner has no GPU and no HEVC MFT: nothing may be reported ok, and
          # nothing that was not attempted may be reported failed.
          $s = $rep.summary
          foreach ($k in 'hevc_hardware_encode_720p_status', 'hevc_hardware_encode_1080p_status', 'hevc_decode_1080p_status', 'hevc_dxva_decode_1080p_status') {
            if ($s.$k -ne 'not_attempted') { throw "$k is $($s.$k), expected not_attempted on a runner without HEVC" }
            if (-not $s.reasons.$k) { throw "$k carries no reason" }
          }
          if ($s.hevc_hardware_accelerated_decode_status -eq 'ok') { throw 'unexpected hardware accelerated decode on the hosted runner' }
          # video_send_possible and the two like it are derived from the *_status values, and tri-state
          # like them: a value that was not asked is never false.
          foreach ($k in 'video_send_possible', 'video_send_1080p_possible', 'video_receive_possible') {
            if ($s.$k -isnot [string] -or $s.$k -notin @('ok', 'failed', 'not_attempted')) { throw "$k is not tri-state: $($s.$k)" }
          }
          if ($s.video_send_possible -ne $s.hevc_hardware_encode_720p_status) { throw 'video_send_possible differs from hevc_hardware_encode_720p_status' }
          if ($s.video_send_1080p_possible -ne $s.hevc_hardware_encode_1080p_status) { throw 'video_send_1080p_possible differs from hevc_hardware_encode_1080p_status' }
          if ($s.video_send_possible -eq 'ok') { throw 'unexpected hardware encode on the hosted runner' }
          if ($s.video_receive_possible -eq 'ok') { throw 'unexpected video receive on the hosted runner (no HEVC decoder)' }
          # The extension report names the three package families, the registration scope, and every
          # registered package with HEVC in its name.
          $ext = $rep.hevc_video_extensions
          if (@($ext.family_names_checked).Count -ne 3) { throw 'the report does not name the three package families' }
          if ($ext.family_names_checked -notcontains 'Microsoft.HEVCVideoExtensionFirstParty_8wekyb3d8bbwe') { throw 'the FirstParty family is not checked' }
          if ($null -eq $ext.registered_current_user) { throw 'registered_current_user is missing' }
          # provisioned_system_image has the same type everywhere: null means "could not be read".
          if (-not $ext.PSObject.Properties['provisioned_system_image']) { throw 'provisioned_system_image is missing' }
          if ($null -ne $ext.provisioned_system_image) { throw "provisioned_system_image must be null (not read by the probe), it is: $($ext.provisioned_system_image)" }
          if (-not $ext.provisioned_system_image_note) { throw 'provisioned_system_image_note is missing' }
          $named = $ext.hevc_named_packages_current_user
          if ($null -eq $named -or $named.readable -isnot [bool] -or -not $named.source) { throw 'hevc_named_packages_current_user is incomplete' }
          if (-not $named.PSObject.Properties['packages'] -or $named.not_in_family_list_count -isnot [int]) { throw 'hevc_named_packages_current_user has no package list or count' }
          # Why there is no decoder is said as measured: the enumerations are named, and a missing
          # registration is not claimed while a package is registered.
          $why = [string]$s.reasons.hevc_decode_720p_status
          if ($why -match 'Extensions are not registered') { throw 'the old, misleading reason text is back' }
          Write-Host "decode reason: $why"
          $none = ($s.hevc_decoder_mft_count_default -eq 0 -and $s.hevc_decoder_mft_count_with_store_flag -le 0 -and $s.hevc_decoder_mft_count_unfiltered -le 0 -and $s.hevc_decoder_mft_count_unfiltered_with_store_flag -le 0)
          if ($none -and $why -notmatch '^MFTEnumEx returns no HEVC decoder MFT to this process') { throw "the decode reason does not say what was measured: $why" }

          # MFTEnumEx with and without MFT_ENUM_FLAG_UNTRUSTED_STOREMFT, and unfiltered.
          $st = $rep.store_mft_enumeration
          if ($null -eq $st) { throw 'store_mft_enumeration is missing' }
          if ($st.flag.name -ne 'MFT_ENUM_FLAG_UNTRUSTED_STOREMFT' -or $st.flag.value -ne '0x00000400') { throw 'the store flag is not named or has the wrong value' }
          foreach ($cat in 'decoders', 'encoders') {
            $vs = @($st.$cat.variants)
            if ((($vs | ForEach-Object { $_.label }) -join ',') -ne 'default,store_flag,unfiltered_all,unfiltered_all_store_flag') { throw "store_mft_enumeration.$cat does not have the four variants in order" }
            foreach ($v in $vs) {
              foreach ($q in $v.queries.PSObject.Properties) {
                if (($q.Value.count -isnot [int] -and $q.Value.count -isnot [long]) -or $q.Value.count -lt -1) { throw "bad count in $cat/$($v.label)/$($q.Name)" }
                Write-Host ("{0}/{1}/{2}: flags {3}, count {4} {5}" -f $cat, $v.label, $q.Name, $q.Value.flags, $q.Value.count, $q.Value.hresult)
              }
              # The flags that were passed are the ones the variant says: the store bit (0x400) only in the
              # variants that carry it, the sort-and-filter bit (0x40) only where it is set, all six
              # selection bits (0x3F) in the "all" queries.
              foreach ($q in $v.queries.PSObject.Properties) {
                $f = [Convert]::ToUInt32($q.Value.flags.Substring(2), 16)
                if ((($f -band 0x400) -ne 0) -ne [bool]$v.store_flag) { throw "store bit mismatch in $cat/$($v.label)/$($q.Name): $($q.Value.flags)" }
                if ((($f -band 0x40) -ne 0) -ne [bool]$v.sort_and_filter) { throw "sort-and-filter bit mismatch in $cat/$($v.label)/$($q.Name): $($q.Value.flags)" }
                if ([bool]$v.all_flags -and ($f -band 0x3F) -ne 0x3F) { throw "the all query of $cat/$($v.label) lacks a selection bit: $($q.Value.flags)" }
              }
            }
            if (-not $st.$cat.PSObject.Properties['only_outside_the_default_enumeration'] -or -not $st.$cat.PSObject.Properties['default_mfts_missing_with_store_flag']) { throw "store_mft_enumeration.$cat lacks the difference lists" }
          }
          foreach ($k in 'hevc_decoder_mft_count_default', 'hevc_decoder_mft_count_with_store_flag', 'hevc_decoder_mft_count_unfiltered', 'hevc_decoder_mft_count_unfiltered_with_store_flag', 'hevc_encoder_mft_count_default', 'hevc_encoder_mft_count_with_store_flag') {
            if (($s.$k -isnot [int] -and $s.$k -isnot [long]) -or $s.$k -lt -1) { throw "$k is not a count: $($s.$k)" }
          }
          if ($s.hevc_decoder_mft_count_default -ne 0) { throw 'the hosted runner is expected to have no HEVC decoder MFT by default' }
          foreach ($k in 'hevc_store_mft_activation_status', 'hevc_store_mft_decode_720p_status', 'hevc_store_mft_decode_1080p_status', 'hevc_other_flags_mft_activation_status', 'hevc_other_flags_mft_decode_720p_status', 'hevc_other_flags_mft_decode_1080p_status') {
            if ($s.$k -notin @('ok', 'failed', 'not_attempted')) { throw "$k is not tri-state: $($s.$k)" }
            if ($s.$k -ne 'ok' -and -not $s.reasons.$k) { throw "$k carries no reason" }
          }
          # Nothing that was not returned may be reported as tested.
          if (@($s.hevc_store_mft_decoders).Count -eq 0 -and $s.hevc_store_mft_decode_720p_status -ne 'not_attempted') { throw 'a store MFT decode is reported although no store MFT was returned' }
          if (@($s.hevc_other_flags_mft_decoders).Count -eq 0 -and $s.hevc_other_flags_mft_decode_720p_status -ne 'not_attempted') { throw 'an other-flags MFT decode is reported although none was returned' }
          if (@($rep.tests | Where-Object { $_.mft_class -ne 'default' }).Count -gt 0 -and @($s.hevc_store_mft_decoders).Count + @($s.hevc_other_flags_mft_decoders).Count -eq 0) { throw 'a test of a non-default MFT exists without a listed MFT' }
          foreach ($t in @($rep.tests)) { if ($t.mft_class -notin @('default', 'store_flag_only', 'needs_other_flags')) { throw "bad mft_class: $($t.mft_class)" } }

          # D3D11VA: what the D3D11 video device of each adapter offers, without any MFT. The hosted
          # runner has no GPU: a software adapter is asked (--ci), run through the same code, and never counts.
          $va = $rep.d3d11va
          if ($null -eq $va -or -not $va.basis) { throw 'd3d11va is missing' }
          if (@($va.profiles_checked).Count -ne 6) { throw 'd3d11va does not check the six profiles' }
          foreach ($need in 'H264_VLD_NOFGT', 'HEVC_VLD_MAIN', 'HEVC_VLD_MAIN10', 'VP9_VLD_PROFILE0', 'VP9_VLD_10BIT_PROFILE2', 'AV1_VLD_PROFILE0') {
            if (-not (@($va.profiles_checked) | Where-Object { $_.profile -eq $need })) { throw "d3d11va does not check $need" }
          }
          if (@($va.adapters).Count -lt 1) { throw 'd3d11va lists no adapter (--ci must run it on a software adapter or WARP)' }
          Test-VaAdapters $va
          foreach ($k in 'hevc_d3d11va_decode_supported', 'hevc_d3d11va_main10_decode_supported') {
            if ($s.$k -notin @('ok', 'failed', 'not_attempted')) { throw "$k is not tri-state: $($s.$k)" }
            if ($s.$k -eq 'ok' -and @($rep.adapters | Where-Object { -not $_.software_adapter }).Count -eq 0) { throw "$k is ok on a machine with no non-software adapter" }
            if ($s.$k -ne 'ok' -and -not $s.reasons.$k) { throw "$k carries no reason" }
          }
          foreach ($k in 'hevc_d3d11va_decode_by_adapter', 'hevc_d3d11va_main10_decode_by_adapter') {
            foreach ($a in @($s.$k)) {
              if ($a.status -notin @('ok', 'failed', 'not_attempted')) { throw "bad status in $k" }
              if ($a.status -eq 'ok' -and $a.software_adapter) { throw "a software adapter is reported ok in $k" }
            }
          }

      # The decoder profile GUIDs of the probe are written out in its source (the SDK declares them as
      # extern GUIDs that would need dxguid.lib, and the newer ones only exist in newer SDKs). Every
      # value must be the one of d3d11.h in the Windows SDK of this runner; a profile the SDK does not
      # know (older SDK) is skipped and said so, but the six that are checked must all be compared.
      - name: The decoder profile GUIDs agree with the Windows SDK
        shell: pwsh
        run: |
          $inc = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $dir = Get-ChildItem $inc -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'um\d3d11.h') } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $dir) { throw 'no Windows SDK with d3d11.h on the runner' }
          Write-Host "Windows SDK $($dir.Name)"
          $text = Get-Content -Raw (Join-Path $dir.FullName 'um\d3d11.h')
          $rep = Get-Content runner-report.json -Raw | ConvertFrom-Json
          $compared = @()
          foreach ($p in @($rep.d3d11va.profile_names_known)) {
            $m = [regex]::Match($text, 'DEFINE_GUID\(\s*D3D11_DECODER_PROFILE_' + [regex]::Escape($p.profile) + '\s*,\s*([^)]*)\)')
            if (-not $m.Success) { Write-Host "the SDK header has no D3D11_DECODER_PROFILE_$($p.profile): not compared"; continue }
            $v = @($m.Groups[1].Value -split ',' | ForEach-Object { [Convert]::ToUInt64($_.Trim().Substring(2), 16) })
            if ($v.Count -ne 11) { throw "unexpected DEFINE_GUID for $($p.profile)" }
            $guid = '{0:X8}-{1:X4}-{2:X4}-{3:X2}{4:X2}-{5:X2}{6:X2}{7:X2}{8:X2}{9:X2}{10:X2}' -f $v[0], $v[1], $v[2], $v[3], $v[4], $v[5], $v[6], $v[7], $v[8], $v[9], $v[10]
            if ($guid -ne $p.guid) { throw "profile $($p.profile): the probe has $($p.guid), the SDK has $guid" }
            $compared += $p.profile
          }
          Write-Host ("compared with the SDK header: {0}" -f ($compared -join ', '))
          foreach ($need in 'H264_VLD_NOFGT', 'HEVC_VLD_MAIN', 'HEVC_VLD_MAIN10', 'VP9_VLD_PROFILE0', 'VP9_VLD_10BIT_PROFILE2', 'AV1_VLD_PROFILE0') {
            if ($compared -notcontains $need) { throw "the GUID of $need was not compared with the SDK (the SDK on the runner is too old, or the name is wrong)" }
          }

      - name: Self-test of the encode and decode machinery (same pipeline, H.264, D3D11 on the software adapter)
        shell: pwsh
        run: |
          # The hosted runner has no HEVC MFT, so the real encode and decode
          # code path would go untested. The same pipeline run on H.264
          # (software MFTs, in-box on desktop Windows) exercises it, 1080p
          # included, and --ci lets the D3D11 attempts run on the software adapter.
          build/Release/hevc-probe.exe --codec h264 --ci --out h264-selftest.json | Out-File -Encoding utf8 h264-selftest.json
          if ($LASTEXITCODE -ne 0) { throw "the probe exited with $LASTEXITCODE (4 = an attempt crashed or timed out)" }
          $rep = Get-Content h264-selftest.json -Raw | ConvertFrom-Json
          $rep.summary | Format-List
          $rep.tests | Format-Table role, kind, mft, resolution, memory, mode, d3d11_manager, status, failed_stage, hresult, frames_in, frames_out, fps
          $rep.tests | Where-Object { $_.notes } | ForEach-Object { $_.mft; $_.notes }
          $enc = @($rep.encoders.mfts).Count
          $dec = @($rep.decoders.mfts).Count
          Write-Host "h264 encoder MFTs: $enc, decoder MFTs: $dec"
          if (@($rep.tests | Where-Object { $_.failed_stage -in @("crash", "timeout") }).Count -gt 0) { throw "self-test: a test crashed or timed out" }
          # A self-test that can skip itself can never fail: a missing H.264 MFT is an error.
          if ($enc -lt 1 -or $dec -lt 1) { throw 'self-test: no H.264 encoder or decoder MFT on this runner image' }
          $s = $rep.summary
          foreach ($k in 'h264_any_encode_720p_status', 'h264_any_encode_1080p_status', 'h264_decode_720p_status', 'h264_decode_1080p_status') {
            if ($s.$k -ne 'ok') { throw "self-test: $k is $($s.$k): $($s.reasons.$k)" }
          }
          if ($s.best_encode_fps_720p -le 0) { throw 'self-test: no encode throughput measured' }
          if (-not $s.stream_source_720p -or -not $s.stream_source_1080p) { throw 'self-test: the stream sources are not reported' }
          if ($s.video_receive_possible -ne 'ok') { throw "self-test: video_receive_possible is $($s.video_receive_possible) although decoding worked" }
          if ($s.video_send_possible -ne $s.h264_hardware_encode_720p_status) { throw 'self-test: video_send_possible is not derived from the hardware encode status' }
          # MFTEnumEx with and without the store flag runs for H.264 too: the four variants, counts, and the
          # default enumeration must still find the in-box decoder and encoder.
          if ($s.h264_decoder_mft_count_default -lt 1 -or $s.h264_encoder_mft_count_default -lt 1) { throw 'self-test: the default enumeration finds no H.264 MFT' }
          foreach ($k in 'h264_decoder_mft_count_with_store_flag', 'h264_decoder_mft_count_unfiltered', 'h264_decoder_mft_count_unfiltered_with_store_flag', 'h264_encoder_mft_count_with_store_flag') {
            if (($s.$k -isnot [int] -and $s.$k -isnot [long]) -or $s.$k -lt -1) { throw "self-test: $k is not a count: $($s.$k)" }
          }
          foreach ($cat in 'decoders', 'encoders') {
            foreach ($v in @($rep.store_mft_enumeration.$cat.variants)) {
              Write-Host ("self-test enumeration {0}/{1}: unique {2}; " -f $cat, $v.label, $v.unique_mfts) -NoNewline
              Write-Host ((@($v.queries.PSObject.Properties) | ForEach-Object { "{0}={1}{2}" -f $_.Name, $_.Value.count, $(if ($_.Value.hresult) { '(' + $_.Value.hresult + ')' } else { '' }) }) -join ' ')
            }
            $def = @($rep.store_mft_enumeration.$cat.variants)[0]
            foreach ($q in $def.queries.PSObject.Properties) { if ($q.Value.hresult) { throw "self-test: the default enumeration failed: $cat/$($q.Name) $($q.Value.hresult)" } }
          }
          Write-Host "self-test store MFT decoders: $(@($s.h264_store_mft_decoders) -join '; '); other flags: $(@($s.h264_other_flags_mft_decoders) -join '; ')"
          foreach ($k in 'h264_store_mft_activation_status', 'h264_store_mft_decode_720p_status', 'h264_other_flags_mft_activation_status', 'h264_other_flags_mft_decode_720p_status') {
            if ($s.$k -notin @('ok', 'failed', 'not_attempted')) { throw "self-test: $k is not tri-state: $($s.$k)" }
          }
          # Any MFT that only a non-default enumeration returned was tested like the others: its tests
          # carry the class, the clsid, and (when ActivateObject failed) say it was refused.
          foreach ($t in @($rep.tests | Where-Object { $_.mft_class -ne 'default' })) {
            if (-not $t.clsid) { throw "self-test: a test of the non-default MFT $($t.mft) has no clsid" }
            if ($t.failed_stage -eq 'activate' -and -not $t.activation_refused) { throw "self-test: $($t.mft) failed to activate without activation_refused" }
            Write-Host ("self-test non-default MFT test: {0} class {1} {2} {3}" -f $t.mft, $t.mft_class, $t.status, $t.failed_stage)
          }
          # D3D11VA runs for H.264 too (primary profile H264_VLD_NOFGT), on the software adapter with --ci.
          . engine/tools/hevc-probe/ci-helpers.ps1
          Test-VaAdapters $rep.d3d11va
          if (@($rep.d3d11va.adapters).Count -lt 1) { throw 'self-test: d3d11va asked no adapter' }
          if ($rep.d3d11va.primary_profile -ne 'H264_VLD_NOFGT') { throw 'self-test: the primary d3d11va profile is not H264_VLD_NOFGT' }
          if ($s.h264_d3d11va_decode_supported -notin @('ok', 'failed', 'not_attempted')) { throw "self-test: h264_d3d11va_decode_supported is $($s.h264_d3d11va_decode_supported)" }
          if ($s.h264_d3d11va_decode_supported -eq 'ok' -and @($rep.adapters | Where-Object { -not $_.software_adapter }).Count -eq 0) { throw 'self-test: a software adapter was counted as D3D11VA decode support' }
          if ($s.h264_d3d11va_decode_supported -ne 'ok' -and -not $s.reasons.h264_d3d11va_decode_supported) { throw 'self-test: h264_d3d11va_decode_supported carries no reason' }
          if ($s.PSObject.Properties['h264_d3d11va_main10_decode_supported']) { throw 'self-test: the HEVC Main10 summary key belongs to the HEVC run only' }
          Write-Host ("self-test d3d11va: {0}; by adapter: {1}" -f $s.h264_d3d11va_decode_supported, ((@($s.h264_d3d11va_decode_by_adapter) | ForEach-Object { "{0}={1}" -f $_.adapter, $_.status }) -join ', '))
          # Every attempt that reached the MFT must say what it did: the HRESULT of each step,
          # and the MFT must have been shut down and released after it.
          $reached = @($rep.tests | Where-Object { $_.status -ne 'not_attempted' -and $_.mode })
          if ($reached.Count -eq 0) { throw 'self-test: no attempt reached an MFT' }
          foreach ($t in $reached) {
            if (@($t.steps).Count -lt 3) { throw "self-test: $($t.mft) has no step trace" }
            if (-not (@($t.steps | Where-Object { $_.stage -eq 'shutdown_object' }).Count)) { throw "self-test: $($t.mft) was not shut down through its activation object" }
            if ($null -eq $t.mft_refs_left_after_release) { throw "self-test: $($t.mft) has no residual reference count" }
          }
          # The D3D11 path ran with a manager, and its stages are reported one by one.
          $d3d = @($rep.tests | Where-Object { $_.memory -eq 'd3d11' -and $_.role -eq 'decode' -and $_.status -ne 'not_attempted' })
          if ($d3d.Count -eq 0) { throw 'self-test: the D3D11 decode path was not exercised' }
          foreach ($t in $d3d) {
            $names = @($t.steps | ForEach-Object { $_.stage })
            $dev = @($t.steps | Where-Object { $_.stage -eq 'create_d3d_device' })
            if ($dev.Count -eq 0) { throw "self-test: $($t.mft) (d3d11) has no create_d3d_device step" }
            if ($dev[0].hresult -eq '0x00000000') {
              foreach ($need in 'create_dxgi_manager', 'reset_device') {
                if ($names -notcontains $need) { throw "self-test: stage $need is not reported for $($t.mft)" }
              }
            }
          }
          # On a software adapter a decode must not be counted as a GPU decode.
          foreach ($t in @($rep.tests | Where-Object { $_.role -eq 'decode' -and $_.status -eq 'ok' -and $_.adapter -and $_.adapter.software_adapter })) {
            if ($t.gpu_path) { throw "self-test: a decode on the software adapter $($t.adapter.description) was counted as a GPU decode" }
          }
          if (@($rep.adapters | Where-Object { -not $_.software_adapter }).Count -eq 0 -and $s.h264_dxva_decode_720p_status -eq 'ok') { throw 'self-test: a software adapter was counted as a GPU decode' }
          # With --ci the D3D11 decode path must actually have run, up to the call that gives the D3D
          # manager to the MFT (on the WARP software rasterizer, which has no video support, the
          # in-box decoder may refuse it: that is a reported failure at that step, not a skipped one).
          $ran = @($d3d | Where-Object { @($_.steps | Where-Object { $_.stage -eq 'set_d3d_manager' }).Count -gt 0 })
          Write-Host ("D3D11 decode attempts that reached set_d3d_manager: " + $ran.Count)
          $d3d | ForEach-Object { Write-Host ("  {0} {1}: {2}" -f $_.mft, $_.resolution, ((@($_.steps) | ForEach-Object { "{0}={1}" -f $_.stage, $_.hresult }) -join ' ')) }
          if ($ran.Count -eq 0) { throw 'self-test: no decode attempt got as far as the set_d3d_manager call' }
          # A decode mode that failed at 720p is not repeated at 1080p. That is not_attempted, with the
          # reason, and must never count as a failure of its own.
          if ($s.h264_dxva_decode_720p_status -eq 'failed') {
            if ($s.h264_dxva_decode_1080p_status -ne 'not_attempted') { throw "self-test: dxva 1080p is $($s.h264_dxva_decode_1080p_status) after a failed 720p, expected not_attempted" }
            $na = @($rep.tests | Where-Object { $_.status -eq 'not_attempted' -and $_.reason_code -eq 'earlier_stage_failed' -and $_.reason })
            if ($na.Count -eq 0) { throw 'self-test: no not_attempted entry with the reason earlier_stage_failed' }
          }

      - name: 1080p alone, and 720p alone (attempts independent of each other)
        shell: pwsh
        run: |
          build/Release/hevc-probe.exe --codec h264 --ci --resolutions 1080 --out h264-1080.json | Out-File -Encoding utf8 h264-1080.json
          if ($LASTEXITCODE -ne 0) { throw "1080p alone: exit $LASTEXITCODE" }
          $r = Get-Content h264-1080.json -Raw | ConvertFrom-Json
          if ($r.summary.h264_any_encode_1080p_status -ne 'ok') { throw '1080p alone: encode is not ok' }
          if ($r.summary.h264_decode_1080p_status -ne 'ok') { throw '1080p alone: decode is not ok' }
          if ($r.summary.h264_any_encode_720p_status -ne 'not_attempted') { throw '1080p alone: 720p must be not_attempted' }
          if (@($r.tests | Where-Object { $_.width -eq 1280 }).Count -ne 0) { throw '1080p alone: a 720p test ran' }
          build/Release/hevc-probe.exe --codec h264 --ci --resolutions 720 --out h264-720.json | Out-File -Encoding utf8 h264-720.json
          if ($LASTEXITCODE -ne 0) { throw "720p alone: exit $LASTEXITCODE" }
          $r = Get-Content h264-720.json -Raw | ConvertFrom-Json
          if ($r.summary.h264_any_encode_720p_status -ne 'ok') { throw '720p alone: encode is not ok' }
          if ($r.summary.h264_any_encode_1080p_status -ne 'not_attempted') { throw '720p alone: 1080p must be not_attempted' }
          if ($r.summary.h264_decode_1080p_status -ne 'not_attempted') { throw '720p alone: 1080p decode must be not_attempted, not failed' }

      - name: Collect the artifact files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/hevc-probe.exe dist/hevc-probe.exe
          Copy-Item runner-report.json dist/ci-runner-report.json
          Copy-Item h264-selftest.json dist/ci-h264-selftest.json
          Copy-Item engine/tools/hevc-probe/run-probe.cmd dist/run-probe.cmd
          Copy-Item engine/tools/hevc-probe/README.md dist/README.md
          $h = (Get-FileHash -Algorithm SHA256 dist/hevc-probe.exe).Hash.ToLower()
          Set-Content -Path dist/hevc-probe.exe.sha256 -Value "$h  hevc-probe.exe" -Encoding ascii
          Get-Content dist/hevc-probe.exe.sha256

      - name: Upload the probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hevc-probe-windows-x64
          path: |
            dist/hevc-probe.exe
            dist/hevc-probe.exe.sha256
            dist/ci-runner-report.json
            dist/ci-h264-selftest.json
            dist/run-probe.cmd
            dist/README.md
          retention-days: 30
          if-no-files-found: error

  hwlab-scripts:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The lab runs Windows PowerShell 5.1: parse with that grammar (shell: powershell).
      # A script that is not pure ASCII is read as ANSI by 5.1 when it has no BOM, so
      # non-ASCII bytes are an error.
      - name: Parse every hwlab script with Windows PowerShell 5.1, ASCII only, no control characters
        shell: powershell
        run: |
          $scripts = @(Get-ChildItem -Path engine/tools/hwlab -Filter *.ps1)
          if ($scripts.Count -lt 5) { throw "expected the hwlab scripts, found $($scripts.Count)" }
          $bad = 0
          foreach ($f in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $bad++
              foreach ($e in $errors) { Write-Host ("{0}:{1}: {2}" -f $f.Name, $e.Extent.StartLineNumber, $e.Message) }
            } else {
              Write-Host ("parsed {0} (PowerShell {1})" -f $f.Name, $PSVersionTable.PSVersion)
            }
            # Non-ASCII bytes, and control characters other than tab, line feed and carriage return
            # (a stray backspace from a bad escape once ended up inside a path string).
            $odd = @([System.IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 -or $_ -eq 127 -or ($_ -lt 32 -and $_ -ne 9 -and $_ -ne 10 -and $_ -ne 13) }).Count
            if ($odd -gt 0) { $bad++; Write-Host ("{0}: {1} non-ASCII or control byte(s)" -f $f.Name, $odd) }
          }
          if ($bad -gt 0) { throw "$bad problem(s) in the hwlab scripts" }

      - name: The HEVC Video Extensions definition is one text in setup-hwlab.ps1 and hwlab-common.ps1
        shell: powershell
        run: |
          function Get-Region([string]$Path) {
            $t = [System.IO.File]::ReadAllText($Path) -replace "`r`n", "`n"
            $m = [regex]::Match($t, '(?s)#region hevc-extensions.*?#endregion hevc-extensions')
            if (-not $m.Success) { throw "no hevc-extensions region in $Path" }
            return $m.Value
          }
          $a = Get-Region 'engine/tools/hwlab/setup-hwlab.ps1'
          $b = Get-Region 'engine/tools/hwlab/hwlab-common.ps1'
          if ($a -ne $b) { throw 'the hevc-extensions region differs between setup-hwlab.ps1 and hwlab-common.ps1' }
          Write-Host ("identical, {0} characters" -f $a.Length)

      - name: Get-HevcExtensionStatus has the agreed shape (one definition of "installed")
        shell: powershell
        run: |
          . (Join-Path (Resolve-Path engine/tools/hwlab) 'hwlab-common.ps1')
          $s = Get-HevcExtensionStatus
          $s | ConvertTo-Json -Depth 4
          if (@($s.family_names).Count -ne 3) { throw 'the three package families must be named' }
          if ($s.family_names -notcontains 'Microsoft.HEVCVideoExtension_8wekyb3d8bbwe') { throw 'family 1 missing' }
          if ($s.family_names -notcontains 'Microsoft.HEVCVideoExtensions_8wekyb3d8bbwe') { throw 'family 2 missing' }
          if ($s.family_names -notcontains 'Microsoft.HEVCVideoExtensionFirstParty_8wekyb3d8bbwe') { throw 'family 3 (FirstParty) missing' }
          # Every registered package with HEVC in its name is listed, so that a new variant is seen.
          if ($s.Keys -notcontains 'hevc_named_packages_current_user' -or $s.Keys -notcontains 'hevc_named_packages_not_in_family_list') { throw 'the *HEVC* package list is missing' }
          if ($null -ne $s.hevc_named_packages_current_user -and $s.hevc_named_packages_not_in_family_list -ne @($s.hevc_named_packages_current_user | Where-Object { -not $_.in_known_family_list }).Count) { throw 'hevc_named_packages_not_in_family_list is not the count of unlisted packages' }
          # The probe (C++) checks the same families as the scripts: one list, compared here.
          $cpp = Get-Content -Raw -Encoding UTF8 engine/tools/hevc-probe/hevc_probe.cpp
          $block = [regex]::Match($cpp, '(?s)kExtFamilies\[\]\s*=\s*\{(.*?)\};').Groups[1].Value
          $inProbe = @([regex]::Matches($block, 'L"([^"]+)"') | ForEach-Object { $_.Groups[1].Value } | Sort-Object)
          $inScripts = @($s.family_names | Sort-Object)
          if (($inProbe -join '|') -ne ($inScripts -join '|')) { throw ("the package families of the probe ({0}) and of the scripts ({1}) differ" -f ($inProbe -join ', '), ($inScripts -join ', ')) }
          Write-Host ("probe and scripts check the same {0} families" -f $inProbe.Count)
          if ($s.summary_basis -ne 'registered_current_user') { throw 'the summary must use the current-user registration' }
          if ($s.installed -ne $s.registered_current_user) { throw 'installed must equal registered_current_user' }
          if ($null -ne $s.provisioned_system_image -and $s.provisioned_system_image -isnot [bool]) { throw 'provisioned_system_image is true, false or null' }

      # The manifest reading of hw-inventory.ps1 is pure: run it on fixture manifests (an HEVC decoder
      # and encoder with a duplicate, an encoder only, a decoder for another codec, no codec extension).
      - name: Get-MediaCodecsFromManifest reads the codecs a package declares (fixture manifests)
        shell: powershell
        run: |
          $errs = $null; $tok = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path engine/tools/hwlab/hw-inventory.ps1).Path, [ref]$tok, [ref]$errs)
          $fn = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Get-MediaCodecsFromManifest' }, $true)
          if ($fn.Count -ne 1) { throw 'Get-MediaCodecsFromManifest not found in hw-inventory.ps1' }
          Invoke-Expression $fn[0].Extent.Text
          $ns = 'xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap4="http://schemas.microsoft.com/appx/manifest/uap/windows10/4" xmlns:wincap3="http://schemas.microsoft.com/appx/manifest/foundation/windows10/windowscapabilities/3"'
          $hevc = '43564548-0000-0010-8000-00AA00389B71'
          $h264 = '34363248-0000-0010-8000-00AA00389B71'
          function Codec([string]$name, [string]$cat, [string]$in, [string]$out) {
            $i = if ($in) { "<uap4:InputTypes><uap4:InputType SubType=`"$in`" /></uap4:InputTypes>" } else { '' }
            $o = if ($out) { "<uap4:OutputTypes><uap4:OutputType SubType=`"$out`" /></uap4:OutputTypes>" } else { '' }
            return "<uap4:MediaCodec DisplayName=`"$name`" Category=`"$cat`" wincap3:ActivatableClassId=`"X.$name`">$i$o</uap4:MediaCodec>"
          }
          function Manifest([string]$codecs) {
            if (-not $codecs) { return [xml]"<Package $ns><Identity Name=`"Fixture`" /></Package>" }
            return [xml]"<Package $ns><Identity Name=`"Fixture`" /><Extensions><uap4:Extension Category=`"windows.mediaCodec`">$codecs</uap4:Extension></Extensions></Package>"
          }
          $both = (Codec 'HEVCDec' 'videoDecoder' $hevc '') + (Codec 'HEVCEnc' 'videoEncoder' '' $hevc) + (Codec 'HEVCEnc' 'videoEncoder' '' $hevc)
          $r = Get-MediaCodecsFromManifest (Manifest $both)
          if (@($r.media_codecs).Count -ne 2) { throw "duplicates are not folded: $(@($r.media_codecs).Count) codecs" }
          if (-not $r.declares_hevc_video_decoder -or -not $r.declares_hevc_video_encoder) { throw 'decoder and encoder were not both found' }
          if (-not ($r.media_codecs | Where-Object { $_.display_name -eq 'HEVCDec' -and $_.category -eq 'videoDecoder' -and $_.takes_hevc_input -and $_.activatable_class_id -eq 'X.HEVCDec' })) { throw 'the decoder entry is wrong' }
          $r = Get-MediaCodecsFromManifest (Manifest (Codec 'HEVCEnc' 'videoEncoder' '' $hevc))
          if ($r.declares_hevc_video_decoder -or -not $r.declares_hevc_video_encoder) { throw 'an encoder-only package must not declare a decoder' }
          $r = Get-MediaCodecsFromManifest (Manifest (Codec 'H264Dec' 'videoDecoder' $h264 ''))
          if ($r.declares_hevc_video_decoder -or $r.declares_hevc_video_encoder) { throw 'a decoder for another codec must not count' }
          $r = Get-MediaCodecsFromManifest (Manifest '')
          if (@($r.media_codecs).Count -ne 0 -or $r.declares_hevc_video_decoder -or $r.declares_hevc_video_encoder) { throw 'a manifest without a codec extension must declare nothing' }
          Write-Host 'manifest fixtures ok'

      - name: hw-inventory.ps1 runs and its report is free of this machine's names
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'inv'
          powershell -NoProfile -ExecutionPolicy Bypass -File engine/tools/hwlab/hw-inventory.ps1 -OutDir $out
          if ($LASTEXITCODE -ne 0) { throw "hw-inventory.ps1 exited with $LASTEXITCODE" }
          $file = Get-ChildItem -Path $out -Filter 'inventory-*.json' | Select-Object -First 1
          if (-not $file) { throw 'no inventory written' }
          $txt = Get-Content -Raw -Encoding UTF8 $file.FullName
          $rep = $txt | ConvertFrom-Json
          $ext = $rep.hevc_video_extensions
          if ($null -eq $ext.registered_current_user) { throw 'registered_current_user missing in the inventory' }
          if ($ext.summary_basis -ne 'registered_current_user') { throw 'the inventory summary must use the current-user registration' }
          if (@($ext.family_names).Count -ne 3) { throw 'the inventory does not name the three package families' }
          if (-not $ext.PSObject.Properties['hevc_named_packages_current_user']) { throw 'the inventory does not list the packages with HEVC in their name' }
          if (-not $rep.PSObject.Properties['hevc_package_media_codecs']) { throw 'the inventory has no hevc_package_media_codecs' }
          if ($txt -notmatch '"hevc_package_media_codecs":\s*\[') { throw 'hevc_package_media_codecs is not a JSON array' }
          foreach ($pc in @($rep.hevc_package_media_codecs)) {
            if ($pc.manifest_read -isnot [bool] -or -not $pc.name) { throw 'a package entry of hevc_package_media_codecs is incomplete' }
          }
          foreach ($s in @($env:COMPUTERNAME, $env:USERNAME)) {
            if ($s -and $s.Length -ge 4 -and $txt.IndexOf($s, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'the inventory contains a machine or user name' }
          }

      - name: engine-local-build.ps1 plans offline, and finds the toolchain with vswhere
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'lab'
          $log = Join-Path $env:RUNNER_TEMP 'plan.txt'
          # Without -AllowDownload the script prints the hosts and URLs, downloads nothing, exits 10.
          powershell -NoProfile -ExecutionPolicy Bypass -File engine/tools/hwlab/engine-local-build.ps1 -RepoDir $PWD.Path -WorkDir $work -ReportDir (Join-Path $work 'reports') -PlanOnly *> $log
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 10) { throw "plan mode exited with $code, expected 10 (plan printed, nothing downloaded)" }
          $plan = Get-Content -Raw $log
          # The hosts it names are the ones the owner has to approve, nothing else.
          $hosts = [regex]::Matches($plan, 'https://([A-Za-z0-9.-]+)/') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          Write-Host ("hosts in the plan: " + ($hosts -join ', '))
          $allowed = @('github.com', 'commondatastorage.googleapis.com')
          foreach ($h in $hosts) { if ($allowed -notcontains $h) { throw "unexpected host in the plan: $h" } }
          if ($hosts -notcontains 'github.com' -or $hosts -notcontains 'commondatastorage.googleapis.com') { throw 'the plan must name both hosts' }
          # The release tag and the file list come from the pins of the repository, not from the script.
          $pins = Get-Content -Raw engine/cmake/webrtc-release.cmake
          $tag = [regex]::Match($pins, 'QMEDIA_WEBRTC_TAG "([^"]+)"').Groups[1].Value
          if (-not $tag -or $plan.IndexOf($tag) -lt 0) { throw 'the plan does not show the pinned release tag' }
          foreach ($f in 'webrtc.lib', 'libcxx.lib', 'webrtc-headers.zip', 'build-flags.json', 'BUILDINFO.json', 'PINS.txt', 'SHA256SUMS') {
            if ($plan.IndexOf("/$tag/$f") -lt 0) { throw "the plan does not list $f" }
          }
          if (Test-Path (Join-Path $work 'webrtc-fetch')) { throw 'plan mode created the fetch folder' }
          # Not in plan mode, and without -AllowDownload: the script must still refuse to download
          # (exit 10) and must create nothing, neither a fetch folder, a build folder nor a report.
          $work2 = Join-Path $env:RUNNER_TEMP 'lab-gate'
          powershell -NoProfile -ExecutionPolicy Bypass -File engine/tools/hwlab/engine-local-build.ps1 -RepoDir $PWD.Path -WorkDir $work2 -ReportDir (Join-Path $work2 'reports') *> (Join-Path $env:RUNNER_TEMP 'gate.txt')
          if ($LASTEXITCODE -ne 10) { throw "without -AllowDownload the script exited with $LASTEXITCODE, expected 10 (nothing downloaded)" }
          if (Test-Path $work2) { throw 'the download gate created files without -AllowDownload' }
          # The CLAUDE.md of the lab lists the same hosts as allowed.
          $cl = Get-Content -Raw engine/tools/hwlab/CLAUDE.md
          if ($cl.IndexOf('commondatastorage.googleapis.com') -lt 0) { throw 'CLAUDE.md does not mention the clang package host' }
          # The GitHub hosts are listed exactly, never with a wildcard; the plan names the same download host.
          if ($cl -match '\*\.githubusercontent\.com') { throw 'CLAUDE.md allows a wildcard githubusercontent.com host' }
          foreach ($h in 'release-assets.githubusercontent.com', 'raw.githubusercontent.com') {
            if ($cl.IndexOf('`' + $h + '`') -lt 0) { throw "CLAUDE.md does not list $h" }
          }
          if ($plan.IndexOf('release-assets.githubusercontent.com') -lt 0) { throw 'the plan does not name the release download host' }
          # Toolchain discovery: vswhere, any edition, no hard-coded path.
          powershell -NoProfile -ExecutionPolicy Bypass -File engine/tools/hwlab/engine-local-build.ps1 -RepoDir $PWD.Path -WorkDir $work -ReportDir (Join-Path $work 'reports') -PreflightOnly
          if ($LASTEXITCODE -ne 0) { throw "preflight exited with $LASTEXITCODE" }
