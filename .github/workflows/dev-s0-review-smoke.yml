name: dev-s0-review-smoke
# TEMPORARY (removed before merge): re-runs the link-smoke job of the review
# fix against the build artifact of the published run.
on:
  push:
    branches: [fix/s0-review-hardening]
permissions:
  contents: read
jobs:
  link-smoke:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo (smoke program and driver)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ctrl
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: out
          run-id: 36953631516
          github-token: ${{ github.token }}

      - name: Re-verify SHA256SUMS
        working-directory: out
        run: sha256sum -c SHA256SUMS

      - name: Fetch the compiler package named by build-flags.json (sha256-verified)
        run: |
          set -euo pipefail
          py=python; command -v python3 >/dev/null 2>&1 && py=python3
          # Both values come from a file the build job produced: link-smoke.py
          # validates them with a full-string match (one line, fixed host and
          # file-name shape, 64 hex digits) before they reach curl. A failure
          # there fails this step (command substitution, set -e).
          pkg=$("$py" ctrl/m150/ci/link-smoke.py --clang-package out/build-flags.json)
          url=${pkg%% *}
          sha=${pkg##* }
          curl --proto '=https' --tlsv1.2 -fsSL -o clang.tar.xz "$url"
          echo "$sha *clang.tar.xz" | sha256sum -c -
          mkdir -p C:/clang
          tar -xJf clang.tar.xz -C C:/clang
          ls C:/clang/bin | head -30

      - name: Compile, link and run the out-of-tree consumer
        run: python ctrl/m150/ci/link-smoke.py out C:/clang C:/smoke ctrl/m150/smoke/consumer.cc
