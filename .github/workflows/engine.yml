name: engine-ipc

# CI for engine/ (the generic media engine process): the IPC codec, schema validator, session
# layer, the Windows named-pipe transport and the engine core on libwebrtc. libwebrtc itself is not
# built here: the pinned Windows release is downloaded (see build-m150-windows.yml for how it is made).
#
#   ipc-linux    (ubuntu-24.04)  unit tests with clang + ASan/UBSan and with gcc -O2, both -Werror
#   fuzz         (ubuntu-24.04)  libFuzzer (ASan + UBSan) on the CBOR/schema decoder and on the
#                                framing + hello + message loop, seeded from engine/ipc/fuzz/corpus
#   ipc-windows  (windows-2022)  IPC library, pipe transport and qaudion-media.exe with MSVC/CMake;
#                                runs the unit tests and the pipe tests (ACL, single client, nonce
#                                reject, oversized frame reject, real process)
#   engine-webrtc (windows-2022) the real engine against the pinned libwebrtc release: every download
#                                is sha256-verified against values pinned in the repo, webrtc.lib's
#                                provenance attestation is verified, the engine is compiled and
#                                linked with the flags of build-flags.json (Chromium clang-cl), and
#                                a test driver runs two engine processes through a full audio call
#
# The path filter keeps this workflow out of the way of the library builds. The hevc-probe tool
# under engine/tools/hevc-probe and the hardware lab kit under engine/tools/hwlab have their own
# workflow (hevc-probe.yml) and are not part of this CMake project.

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '!engine/tools/hevc-probe/**'
      - '!engine/tools/hwlab/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '!engine/tools/hevc-probe/**'
      - '!engine/tools/hwlab/**'
      - '.github/workflows/engine.yml'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "seconds per fuzz target (two targets run one after the other)"
        default: "150"

permissions:
  contents: read

concurrency:
  group: engine-ipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipc-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-asan-ubsan
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
            sanitize: address,undefined
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitize: ""
    name: ipc-linux (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 ninja-build
          # ASan on the 24.04 runner kernel needs a smaller address-space randomization range.
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          ${{ matrix.cxx }} --version | head -1
          cmake --version | head -1

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S engine -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DQMEDIA_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build

      - name: Unit tests (codec, validator, session, CDDL sync, seed corpus)
        run: ctest --test-dir build --output-on-failure

      - name: Seed corpus is up to date with the schema
        run: |
          set -euo pipefail
          rm -rf corpus-regen
          ./build/ipc/qmedia_corpus_gen corpus-regen
          diff -r corpus-regen engine/ipc/fuzz/corpus

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: ipc-linux
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '150' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev ninja-build
          sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Build the fuzz targets (libFuzzer, ASan + UBSan)
        run: |
          set -euo pipefail
          cmake -S engine -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DQMEDIA_BUILD_FUZZERS=ON -DQMEDIA_BUILD_TESTS=OFF \
            -DQMEDIA_SANITIZE=address,undefined
          cmake --build build-fuzz --target fuzz_message fuzz_session

      - name: Run fuzz_message (CBOR decoder and schema validator)
        run: |
          set -euo pipefail
          mkdir -p fuzz-work/message fuzz-out
          cp engine/ipc/fuzz/corpus/message/* fuzz-work/message/
          ./build-fuzz/ipc/fuzz_message fuzz-work/message \
            -max_total_time="$FUZZ_SECONDS" -max_len=70000 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=fuzz-out/message- -print_final_stats=1

      - name: Run fuzz_session (framing, hello with nonce, message loop)
        run: |
          set -euo pipefail
          mkdir -p fuzz-work/session
          cp engine/ipc/fuzz/corpus/session/* fuzz-work/session/
          ./build-fuzz/ipc/fuzz_session fuzz-work/session \
            -max_total_time="$FUZZ_SECONDS" -max_len=70000 -timeout=10 -rss_limit_mb=2048 \
            -artifact_prefix=fuzz-out/session- -print_final_stats=1

      - name: Upload crashes and the grown corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-fuzz-output
          path: |
            fuzz-out/
            fuzz-work/
          if-no-files-found: ignore
          retention-days: 7

  ipc-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure (Visual Studio 2022, x64)
        shell: pwsh
        run: |
          cmake -S engine -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build IPC library, pipe transport, tests and qaudion-media.exe
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests and pipe tests (ACL, single client, nonce reject, oversize reject, real process)
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Engine executable hardening flags are present
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter qaudion-media.exe build | Select-Object -First 1
          if (-not $exe) { throw "qaudion-media.exe not built" }
          # Read the PE header directly (no dependency on the VS command prompt).
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $dll = [BitConverter]::ToUInt16($bytes, $pe + 24 + 70)   # OptionalHeader.DllCharacteristics (PE32+)
          $dynamicBase = ($dll -band 0x0040) -ne 0
          $highEntropy = ($dll -band 0x0020) -ne 0
          $nxCompat = ($dll -band 0x0100) -ne 0
          $guardCf = ($dll -band 0x4000) -ne 0
          Write-Host ("DllCharacteristics=0x{0:X4} dynamicBase={1} highEntropyVA={2} nxCompat={3} guardCF={4}" -f $dll, $dynamicBase, $highEntropy, $nxCompat, $guardCf)
          if (-not ($dynamicBase -and $highEntropy -and $nxCompat -and $guardCf)) { throw "missing hardening flag" }

  engine-webrtc:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download and verify the pinned release and the compiler package
        shell: pwsh
        run: |
          cmake "-DQMEDIA_FETCH_DIR=$env:RUNNER_TEMP/qm" -P engine/cmake/fetch_webrtc.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the build provenance attestation of webrtc.lib
        shell: pwsh
        run: |
          # Strict: the signature, the repository and the builder workflow must verify. A transient
          # failure is retried; there is no weaker fallback (an attestation record that merely
          # exists proves nothing).
          $lib = Join-Path $env:RUNNER_TEMP "qm/release/webrtc.lib"
          $ok = $false
          foreach ($attempt in 1..4) {
            gh attestation verify $lib --repo sigarone/webrtc-aes256-build --signer-workflow sigarone/webrtc-aes256-build/.github/workflows/build-m150-windows.yml
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "gh attestation verify failed (attempt $attempt, exit $LASTEXITCODE)"
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $ok) { throw "the build provenance attestation of webrtc.lib did not verify" }
          Write-Host "attestation: verified with gh attestation verify (repo and signer workflow pinned)"

      - name: The pins cannot be bypassed (missing file, changed file, stale headers all fail)
        shell: pwsh
        run: |
          $qm = Join-Path $env:RUNNER_TEMP "qm"
          $rel = Join-Path $qm "release"
          $clang = Join-Path $qm "clang"
          # The real directories pass.
          cmake "-DQMEDIA_WEBRTC_DIR=$rel" "-DQMEDIA_CLANG_ROOT=$clang" -P engine/cmake/verify_pins.cmake
          if ($LASTEXITCODE -ne 0) { throw "the verified directories do not pass verify_pins.cmake" }
          function Expect-Fail($dir, $why) {
            $out = cmake "-DQMEDIA_WEBRTC_DIR=$dir" "-DQMEDIA_CLANG_ROOT=$clang" -P engine/cmake/verify_pins.cmake 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { throw "verify_pins.cmake accepted: $why" }
            Write-Host "refused as it must: $why"
          }
          $bad = Join-Path $env:RUNNER_TEMP "qm-bad"
          if (Test-Path $bad) { Remove-Item -Recurse -Force $bad }
          New-Item -ItemType Directory $bad | Out-Null
          Expect-Fail $bad "an empty directory"
          Copy-Item -Recurse (Join-Path $rel "*") $bad
          Add-Content -Path (Join-Path $bad "PINS.txt") -Value "x"
          Expect-Fail $bad "a changed PINS.txt"
          Copy-Item (Join-Path $rel "PINS.txt") (Join-Path $bad "PINS.txt") -Force
          Remove-Item (Join-Path $bad "libcxx.lib")
          Expect-Fail $bad "a missing libcxx.lib"
          Copy-Item (Join-Path $rel "libcxx.lib") (Join-Path $bad "libcxx.lib")
          Set-Content -NoNewline -Path (Join-Path $bad "hdr/.qmedia-archive-sha256") -Value "00"
          Expect-Fail $bad "headers that do not come from the pinned archive"
          Remove-Item -Recurse -Force $bad
          exit 0  # the last cmake run above failed on purpose; its exit code must not become the step result

      - name: Configure (Chromium clang-cl, Ninja, flags from build-flags.json)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S engine -B build-rtc -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=%RUNNER_TEMP%/qm/toolchain.cmake" -DQMEDIA_WITH_WEBRTC=ON -DQMEDIA_BUILD_TESTS=ON "-DCMAKE_CXX_FLAGS=" || exit /b 1

      - name: Build the engine, the CI engine, the hardware bench engine and the test drivers
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --build build-rtc --target qaudion-media qaudion-media-ci qaudion-media-hw qmedia_call_test qmedia_audio_bench || exit /b 1

      - name: Engine executable hardening flags and CI-only code
        shell: pwsh
        run: |
          $exe = (Resolve-Path build-rtc\qaudion-media.exe).Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $dll = [BitConverter]::ToUInt16($bytes, $pe + 24 + 70)
          $dynamicBase = ($dll -band 0x0040) -ne 0
          $highEntropy = ($dll -band 0x0020) -ne 0
          $nxCompat = ($dll -band 0x0100) -ne 0
          Write-Host ("DllCharacteristics=0x{0:X4} dynamicBase={1} highEntropyVA={2} nxCompat={3}" -f $dll, $dynamicBase, $highEntropy, $nxCompat)
          if (-not ($dynamicBase -and $highEntropy -and $nxCompat)) { throw "missing hardening flag" }
          # The production engine has no way to read or write audio files.
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains("ci-audio-in") -or $text.Contains("FileAudioDevice")) { throw "CI-only code found in the production engine" }
          if ($text.Contains("ci-audio-out") -or $text.Contains("ci-allow-loopback")) { throw "CI-only code found in the production engine" }
          # Nor does it carry any of the hardware bench (real-audio bench, tools/hwlab): that flag and
          # the bench driver's strings live only in qaudion-media-hw and qmedia_audio_bench.
          foreach ($s in @("hw-allow-loopback", "qmedia_audio_bench", "engine-audio-bench", "audio-bench")) {
            if ($text.Contains($s)) { throw "hardware-bench code ($s) found in the production engine" }
          }
          # Behaviour of the binary itself: the CI flags are not options of the production
          # executable (exit code 2 = bad command line, before anything is read or opened).
          foreach ($flagArgs in @(@("--ci-allow-loopback"), @("--ci-audio-in", "x"), @("--ci-audio-out", "x"), @("--hw-allow-loopback"))) {
            & $exe --pipe '\\.\pipe\qmedia-flag-check' @flagArgs
            if ($LASTEXITCODE -ne 2) { throw "the production engine accepted $($flagArgs[0]) (exit $LASTEXITCODE)" }
          }
          Write-Host "the production engine rejects every CI and hardware-bench flag (exit 2)"
          $ci = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Resolve-Path build-rtc\qaudion-media-ci.exe).Path))
          if (-not $ci.Contains("ci-audio-in")) { throw "the CI engine lacks its CI flags" }
          # The hardware bench engine is a separate build: its own flag only, no file audio device.
          $hw = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Resolve-Path build-rtc\qaudion-media-hw.exe).Path))
          if (-not $hw.Contains("hw-allow-loopback")) { throw "the bench engine lacks its flag" }
          if ($hw.Contains("ci-audio-in") -or $hw.Contains("FileAudioDevice") -or $hw.Contains("ci-allow-loopback")) { throw "CI-only code found in the bench engine" }
          foreach ($flagArgs in @(@("--ci-allow-loopback"), @("--ci-audio-in", "x"), @("--ci-audio-out", "x"))) {
            & (Resolve-Path build-rtc\qaudion-media-hw.exe).Path --pipe '\\.\pipe\qmedia-flag-check' @flagArgs
            if ($LASTEXITCODE -ne 2) { throw "the bench engine accepted $($flagArgs[0]) (exit $LASTEXITCODE)" }
          }
          Write-Host "the bench engine rejects every CI flag (exit 2)"
          Write-Host ("size: " + $bytes.Length + " bytes")
          exit 0  # the flag checks above end with a native exit code of 2 on purpose

      - name: Bench logic without hardware (dry run with file devices, device listing)
        shell: pwsh
        run: |
          # The real-audio bench driver on the CI runner: the whole call with the file devices
          # (never the sound card), and its JSON report must say the strict transport was ok.
          $bd = Join-Path $env:RUNNER_TEMP "bench"
          build-rtc\qmedia_audio_bench.exe --dry --seconds 6 --work $bd --out (Join-Path $bd "report.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content -Raw (Join-Path $bd "report.json") | ConvertFrom-Json
          if (-not $r.transport_ok) { throw "the bench call did not report a strict transport" }
          if ($r.mode -ne "dry-file-devices") { throw "unexpected bench mode" }

      - name: Two engines, one call (DTLS 1.3, PQC group, AES-256 everywhere, frame keys, negative cases)
        shell: pwsh
        run: |
          build-rtc\qmedia_call_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
