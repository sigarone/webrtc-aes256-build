name: build-webrtc-android-m150-hardened

# Builds the Android M150 AAR (plain org.webrtc; the LiveKit-prefixed -lk
# variant is gone) in one dispatch, gates it (m150/gates.sh, G1-G10), then
# publishes it to a NEW release tag with sha256 + attestation.
#
# Job graph (finding #16 - a single job that both builds untrusted patched
# C++ AND holds contents:write/id-token:write/attestations:write is a
# privilege-escalation surface: a malicious patch or a supply-chain-
# compromised build tool would run with release/attestation rights):
#   precheck (contents: read)          - validate inputs, refuse if the
#                                         release tag already exists
#   build   (contents: read)  <- needs precheck
#                                      - compiles, gates, uploads a workflow
#                                         artifact only (no repo/release
#                                         access at all in this job)
#   publish (contents: write,
#            id-token: write,
#            attestations: write) <- needs [precheck, build]
#                                      - downloads the build job's artifact,
#                                         RE-VERIFIES sha256 against
#                                         SHA256SUMS, re-checks the tag is
#                                         still free (race with a concurrent
#                                         dispatch across the ~3-4h build),
#                                         attests, creates the release.
#
# All dispatch inputs reach the shell ONLY via env (never interpolated into
# a run: block), and are charset-validated in `precheck` before anything
# else runs.

on:
  workflow_dispatch:
    inputs:
      webrtc_ref:
        description: "tag on the fork (webrtc_fork_url) - see m150/ci/sync.sh for why a tag and not a raw SHA"
        default: "ba469aa2093b-qaudion-m150"
      webrtc_fork_url:
        description: "fork to sync from (must already carry webrtc_ref at exactly ba469aa2093ba950066258ca0a59a6fbd1295582 - Appendix B of webrtc-plan.md)"
        default: "https://github.com/sigarone/webrtc.git"
      release_suffix:
        description: "appended to the tag, e.g. a256-dplc-1 (the FULL tag - webrtc-android-m150-<this> - must not already exist)"
        required: true

env:
  IN_WEBRTC_REF: ${{ github.event.inputs.webrtc_ref }}
  IN_FORK_URL: ${{ github.event.inputs.webrtc_fork_url }}
  IN_SUFFIX: ${{ github.event.inputs.release_suffix }}
  # depot_tools is pinned inside m150/ci/sync.sh itself (reviewed constant,
  # no Actions-variable override - finding #18).

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag_plain: ${{ steps.tags.outputs.tag_plain }}
    steps:
      - name: Validate dispatch inputs (charset allow-list, fail closed)
        run: |
          set -euo pipefail
          case "$IN_WEBRTC_REF" in ''|*[!A-Za-z0-9._/-]*) echo "::error::webrtc_ref: only [A-Za-z0-9._/-] allowed"; exit 1 ;; esac
          case "$IN_FORK_URL" in https://github.com/*.git) ;; *) echo "::error::webrtc_fork_url: must be an https://github.com/*.git URL"; exit 1 ;; esac
          case "$IN_SUFFIX" in ''|*[!A-Za-z0-9._-]*) echo "::error::release_suffix: only [A-Za-z0-9._-] allowed"; exit 1 ;; esac

      - name: Compute + reserve tag names
        id: tags
        run: |
          set -euo pipefail
          echo "tag_plain=webrtc-android-m150-${IN_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Refuse if the release or git tag already exists (never overwrite a shipped rollback asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for t in "webrtc-android-m150-${IN_SUFFIX}"; do
            if gh release view "$t" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::release tag '$t' already exists - use a new release_suffix"
              exit 1
            fi
            # A bare git tag (no release) would make `gh release create` attach
            # the new assets to whatever commit that tag already points at.
            # ls-remote fails (non-zero) on a network error: fail closed.
            refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$t")
            if [ -n "$refs" ]; then
              echo "::error::git tag '$t' already exists - use a new release_suffix"
              exit 1
            fi
          done

  build:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      WORKDIR: /home/runner/webrtc
      GN_STRICT: "true"
      # Never let a depot_tools wrapper self-update past the pin in sync.sh.
      DEPOT_TOOLS_UPDATE: "0"
      # Root cause of runs 36547153188/36598248775/36621762942/36627163222
      # (the retired lk leg dying with the runner lost, no retrievable
      # log): the Actions runner's OWN worker crashed with an unhandled
      # System.IO.IOException ("No space left on device") writing its
      # _diag trace log to /home/runner/actions-runner/... on the ROOT
      # filesystem (confirmed via the check-run annotation on run
      # 36627163222) - not a script-level failure at all. depot_tools,
      # vpython and pip caches are routed onto the large build volume
      # instead of root's default $HOME/.cache.
      CIPD_CACHE_DIR: /home/runner/webrtc/.cipd
      XDG_CACHE_HOME: /home/runner/webrtc/.cache
      PIP_CACHE_DIR: /home/runner/webrtc/.pipcache
      VPYTHON_VIRTUALENV_ROOT: /home/runner/webrtc/.vpython
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          # root-reserve-mb is "space to be left free on the root
          # filesystem" - requested 4096 (4G) on earlier runs. The build
          # log's own "Disk space report after modification" showed root at
          # 100M avail immediately afterward, before any of this workflow's
          # own steps ran. Whatever accounts for that ~4G gap (rounding,
          # filesystem reserve blocks, or something else in that pinned
          # action version), the fix here is margin, not precision: ask for
          # 16384 (16G) instead. The build volume has 71G free at 24% used
          # (this build uses ~22-24G of it), so giving 12G more of that back
          # to root costs nothing.
          root-reserve-mb: 16384
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: '/home/runner/webrtc'

      - name: Checkout this repo (scripts, patches, gates)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ctrl
          persist-credentials: false

      - name: Sync M150 source (pinned depot_tools, hard-verified src/boringssl/opus pins)
        env:
          WEBRTC_FORK_URL: ${{ env.IN_FORK_URL }}
        run: bash ctrl/m150/ci/sync.sh "$WORKDIR" "$IN_WEBRTC_REF" android,unix

      - name: Apply patch series (variant=android)
        run: bash ctrl/m150/apply-series.sh "$WORKDIR/src" android

      - name: Fetch Opus DNN weights (sha256-pinned)
        run: bash ctrl/m150/fetch-opus-dnn-weights.sh "$WORKDIR/src/third_party/opus/src"

      - name: Build raw AAR (arm64-v8a)
        working-directory: /home/runner/webrtc/src
        run: |
          set -euo pipefail
          GN_ARGS="is_component_build=false rtc_include_tests=false is_debug=false symbol_level=1 rtc_build_examples=false rtc_build_tools=false rtc_libvpx_build_vp9=true rtc_enable_symbol_export=true rtc_use_h264=true use_rtti=true use_clang_modules=false is_java_debug=false treat_warnings_as_errors=false rtc_qaudion_transport_strict=${GN_STRICT}"
          echo "GN_ARGS=$GN_ARGS" >> "$GITHUB_ENV"
          vpython3 tools_webrtc/android/build_aar.py \
            --build-dir out/aar \
            --arch arm64-v8a \
            --output "$RUNNER_TEMP/raw.aar" \
            --extra-gn-args "$GN_ARGS"
          ls -lh "$RUNNER_TEMP/raw.aar"

      - name: Package (plain passthrough + G1 spot-check)
        run: |
          set -euo pipefail
          # The root fs keeps only ~4 GB after maximize-build-space: work on
          # the large build volume and drop the ninja object dirs, which are
          # no longer needed once raw.aar exists.
          export TMPDIR="$WORKDIR/tmp"; mkdir -p "$TMPDIR"
          find "$WORKDIR/src/out" -mindepth 2 -maxdepth 2 -type d -name obj -exec rm -rf {} + 2>/dev/null || true
          df -h / "$WORKDIR" | sed 's/^/disk: /'
          mkdir -p out
          bash ctrl/m150/ci/package-android.sh plain "$RUNNER_TEMP/raw.aar" out/

      - name: Gate G1-G9
        run: |
          set -euo pipefail
          AAR=$(find out -maxdepth 1 -name '*.aar')
          bash ctrl/m150/gates.sh android plain "$AAR" \
            "$WORKDIR/src/third_party/opus/src/dnn" \
            "$WORKDIR/src/third_party/boringssl/src/include/openssl/ssl.h"

      - name: BUILDINFO.json (BEFORE SHA256SUMS - finding #16)
        env:
          RUNNER_IMAGE: ${{ runner.name }}-ubuntu-latest
        run: |
          set -euo pipefail
          python3 ctrl/m150/buildinfo.py android plain > out/BUILDINFO.json
          cat out/BUILDINFO.json

      - name: SHA256SUMS (covers the AAR AND BUILDINFO.json)
        run: (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Upload build artifact (workflow-scoped only - no repo/release access in this job)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-plain
          path: out/*
          if-no-files-found: error

  publish:
    needs: [precheck, build]
    # A build that failed never uploaded its artifact (the upload is the build
    # job's last step, after the gates), so a failed build fails closed at the
    # download below.
    if: ${{ !cancelled() && needs.precheck.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-plain
          path: out

      - name: Re-verify SHA256SUMS (do not trust the artifact store blindly)
        working-directory: out
        run: sha256sum -c SHA256SUMS

      - name: Refuse if the release tag appeared while we were building (race safety)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.precheck.outputs.tag_plain }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release tag '$TAG' now exists (created concurrently?) - refusing to publish over it"
            exit 1
          fi
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG")
          if [ -n "$refs" ]; then
            echo "::error::git tag '$TAG' now exists - refusing to attach a release to it"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "out/*.aar\nout/SHA256SUMS"

      - name: Create release (new tag only, never overwritten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "M150 Android AAR (plain), source webrtc-sdk/webrtc@ba469aa2093b, BoringSSL@f91f1447, Opus@55513e81. See BUILDINFO.json and the build-provenance attestation." \
            out/* \
            || echo "::warning::GITHUB_TOKEN could not create release $TAG (HTTP 403 seen 2026-09-29). The artifact is attested and sha256-verified; the maintainer publishes it from this run with a personal token."
